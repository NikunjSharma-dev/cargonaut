[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cargonaut-oss"
version = "1.0.0"
description = "Modular Logistics & Supply Chain Operating System"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["migrations/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# Line length is a soft guide here, not a gate
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
