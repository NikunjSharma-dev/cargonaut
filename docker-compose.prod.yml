services:
  # ─── PostgreSQL + PostGIS ───────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-fleetforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetforge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-fleetforge}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-fleetforge}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      SECRET_KEY: "${SECRET_KEY:-prod-secret-key-cargonaut-fleetforge-9876543210}"
      DEBUG: "false"
      ALLOWED_ORIGINS: "http://159.65.150.71,http://159.65.150.71:8000,http://159.65.150.71:3000,*"
      ALLOWED_HOSTS: "*"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # ─── Celery Worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    restart: always
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-fleetforge}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-fleetforge}"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
      ALLOWED_ORIGINS: "*"
      ALLOWED_HOSTS: "*"
      SECRET_KEY: "${SECRET_KEY:-prod-secret-key-cargonaut-fleetforge-9876543210}"
    depends_on:
      - db
      - redis
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2 -E

  # ─── Celery Beat ─────────────────────────────────────────────────────────────
  beat:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    restart: always
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-fleetforge}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-fleetforge}"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
      ALLOWED_ORIGINS: "*"
      ALLOWED_HOSTS: "*"
      SECRET_KEY: "${SECRET_KEY:-prod-secret-key-cargonaut-fleetforge-9876543210}"
    depends_on:
      - db
      - redis
    command: celery -A app.workers.celery_app beat --loglevel=info

  # ─── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://159.65.150.71:8000
        VITE_WS_URL: ws://159.65.150.71:8000
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    restart: always
    ports:
      - "80:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
