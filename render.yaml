services:
  - type: web
    name: cargonaut-api
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.api
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cargonaut-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cargonaut-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: cargonaut-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: cargonaut-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DEBUG
        value: "false"

  - type: web
    name: cargonaut-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cargonaut-api
          property: hostport
      - key: VITE_WS_URL
        value: wss://cargonaut-api.onrender.com
      - key: VITE_MAPBOX_TOKEN
        sync: false

  - type: keyvalue
    name: cargonaut-redis
    plan: free
    region: oregon
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: cargonaut-db
    databaseName: fleetforge
    user: fleetforge
    plan: free
    region: oregon
